<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake Prediction</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">
    
    <link rel="stylesheet" href="static/css/earthquake.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand d-flex align-items-center" href="#">
      🌍 <span class="ms-2 fw-bold">NatureAlert</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{url_for('home')}}">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="{{url_for('earth')}}">Earthquake</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('cyclone')}}">Hurricane</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('flood')}}">Flood</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('query')}}">AI Query</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('fs')}}">Safety Tips</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero-section text-center d-flex flex-column justify-content-center align-items-center">
    <h1 class="display-5 fw-bold">Earthquake Prediction</h1>
    <p class="lead">Let's make this world a safer place!</p>
  </header>

  <!-- Prediction Form Section -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm p-4">
          <div class="card-body">
            <h5 class="card-title text-center mb-4">Enter the Parameters</h5>
            <form action="{{url_for('pre')}}" method="post">
              <div class="mb-3">
                <input class="form-control" type="number" step="0.1" name="latitude" id="latitude" placeholder="Enter the latitude of the place" required />
              </div>
              <div class="mb-3">
                <input class="form-control" type="number" step="0.1" name="longitude" id="longitude" placeholder="Enter the longitude of the place" required />
              </div>
              <div class="mb-3">
                <input class="form-control" type="number" step="0.1" name="gap" id="gap" placeholder="Enter the gap between the last earthquake" required />
              </div>
              <button type="submit" class="btn btn-danger btn-lg w-100">Let's Predict</button>
            </form>

            <!-- Prediction Result -->
            {% if prediction_text %}
            <h3 class="mt-4 text-center">{{ prediction_text }}</h3>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer bg-dark text-light text-center py-4">
    &copy; 2025 <strong>NatureAlert</strong> | Disaster Prediction & Safety Guide
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
